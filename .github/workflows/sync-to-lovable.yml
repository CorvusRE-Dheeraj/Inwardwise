name: Sync to Lovable

# Every push to main is checked with a build, then copied to the Lovable repo
# (Inwardwise/clear-path-finder-61). Publish in Lovable to put it live on inwardwise.com.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-to-lovable
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Push to Lovable repo
        env:
          LOVABLE_REPO_TOKEN: ${{ secrets.LOVABLE_REPO_TOKEN }}
        run: |
          if [ -z "$LOVABLE_REPO_TOKEN" ]; then
            echo "::error::Secret LOVABLE_REPO_TOKEN is not set."
            exit 1
          fi
          # Plain (non-force) push: if Lovable has edits not in this repo, this fails
          # instead of overwriting them. Merge those edits into main here, then re-run.
          git push "https://x-access-token:${LOVABLE_REPO_TOKEN}@github.com/Inwardwise/clear-path-finder-61.git" HEAD:main
