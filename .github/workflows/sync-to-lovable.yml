name: Sync to Lovable

# Every push to main is checked with a build, then copied to the Lovable repo
# (Inwardwise/clear-path-finder-61). Publish in Lovable to put it live on inwardwise.com.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-to-lovable
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Push to Lovable repo
        env:
          # Private half of a write-enabled deploy key on Inwardwise/clear-path-finder-61.
          LOVABLE_DEPLOY_KEY: ${{ secrets.LOVABLE_DEPLOY_KEY }}
        run: |
          if [ -z "$LOVABLE_DEPLOY_KEY" ]; then
            echo "::error::Secret LOVABLE_DEPLOY_KEY is not set."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$LOVABLE_DEPLOY_KEY" > ~/.ssh/lovable_deploy_key
          chmod 600 ~/.ssh/lovable_deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/lovable_deploy_key -o IdentitiesOnly=yes"
          # Plain (non-force) push: if Lovable has edits not in this repo, this fails
          # instead of overwriting them. Merge those edits into main here, then re-run.
          git push git@github.com:Inwardwise/clear-path-finder-61.git HEAD:main
