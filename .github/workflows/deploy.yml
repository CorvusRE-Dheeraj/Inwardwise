name: Deploy Inwardwise

# Every push to dev (i.e. every PR merged into dev) builds the site and
# deploys it to GitHub Pages: https://corvusre-dheeraj.github.io/Inwardwise/
#
# Static hosting only: vite.config.ts builds the app as an SPA (nitro off),
# so server functions (src/lib/*.functions.ts) and server routes
# (src/routes/api/*) are NOT available on this deploy until they move off
# TanStack Start's server (e.g. to Supabase Edge Functions).
#
# Tests run in pr-checks.yml on the PR itself, which gates the merge that
# produces this push; this workflow only builds and ships.
#
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a second push waits instead of racing the first.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # bun.lock is the maintained lockfile (package-lock.json is stale, so
      # `npm ci` fails).
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      # VITE_SUPABASE_* (public, client-side-by-design) come from the
      # committed .env.
      - run: bun run build
        env:
          SITE_BASE: /Inwardwise/

      # SPA fallback: Pages serves 404.html for unknown paths, so deep links
      # like /Inwardwise/connect/music still load the app.
      - name: Prepare static site
        run: |
          cp dist/client/_shell.html dist/client/index.html
          cp dist/client/_shell.html dist/client/404.html
          touch dist/client/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
